name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:

  test:
    runs-on: ${{ matrix.os }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_NAME: root
      DB_PORT: 5432
    strategy:
      matrix:
        os: ['ubuntu-latest']
        go_version: ['>=1.18']
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go_version }}
      
    - name: Wait for Postgres
      run: |
        for i in {1..60}; do
          pg_isready -h 127.0.0.1 -p 5432 -U root -d root && exit 0
          echo "Aguardando Postgres..."
          sleep 1
        done
        echo "Postgres não ficou pronto a tempo"; exit 1

    - name: Test
      run: go test -v main_test.go 
      
  
  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest']
    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: go build -v main.go

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: programa
        path: main
  
  docker:
    needs: build
    uses: ./.github/workflows/Docker.yml
    secrets: inherit

  #EC2:
    #needs: build
    #uses: ./.github/workflows/EC2.yml
    #secrets: inherit

  ECS:
    needs: docker
    uses: ./.github/workflows/ECS.yml
    secrets: inherit